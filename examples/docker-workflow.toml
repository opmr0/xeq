# Docker workflow
# xeq run build, start, push, clean
# override vars at runtime: xeq run push --args tag=v1.2.0

[vars]
image = "myapp"
tag = "latest"
port = "8080"

[build]
description = "Build the Docker image"
run = ["docker build -t {{@image}}:{{@tag}} ."]

[start]
description = "Run the container"
run = ["docker run -p {{@port}}:{{@port}} {{@image}}:{{@tag}}"]

[push]
description = "Build and push to registry"
run = [
    "xeq://build",
    "docker push {{@image}}:{{@tag}}"
]

[clean]
description = "Remove stopped containers and dangling images"
run = [
    "docker container prune -f",
    "docker image prune -f"
]
