[check]
description = "Run all checks in parallel"
parallel_threads = 4
run = [
    "cargo fmt --check",
    "cargo clippy -- -D warnings",
    "cargo test"
]

[fix]
description = "Auto-fix formatting and clippy warnings"
run = [
    "cargo fmt",
    "cargo clippy --fix --allow-dirty"
]

[build]
description = "Release build"
options = ["quiet"]
run = [
    "cargo fmt",
    "cargo clippy -- -D warnings",
    "cargo build --release"
]

[test]
description = "Run tests with output"
run = ["cargo test -- --nocapture"]

[doc]
description = "Build and open documentation"
run = [
    "cargo doc --no-deps",
    "cargo doc --open"
]

[publish]
description = "Full publish pipeline"
run = [
    "xeq://check",
    "xeq://build",
    "cargo publish"
]

[clean]
description = "Clean build artifacts"
run = ["cargo clean"]
