# Rust project workflow
# xeq run check, build, publish

[check]
description = "Format, lint and test in parallel"
options = ["parallel"]
run = [
    "cargo fmt --check",
    "cargo clippy -- -D warnings",
    "cargo test"
]

[build]
description = "Build release binary"
run = [
    "cargo fmt",
    "cargo build --release"
]

[publish]
description = "Check then publish to crates.io"
run = [
    "xeq://check",
    "cargo publish"
]
