[package]
name = "xeq"
version = "2.0.1"
edition = "2021"
description = "Run sequences of commands from a TOML file with a single word"
license = "MIT"
repository = "https://github.com/opmr0/xeq"
readme = "README.md"
keywords = ["task-runner", "automation", "cli", "build-tool", "toml"]
categories = ["command-line-utilities", "development-tools", "config"]


[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
clearscreen = "4.0.6"
colored = "3.1.1"
confy = "0.6.1"
dirs = "6.0.0"
dotenvy = "0.15.7"
dunce = "1.0.5"
open = "5.3.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.7"

[dev-dependencies]
tempfile = "3"
