[package]
name = "xeq"
version = "2.4.1"
edition = "2021"
description = "xeq is a cross-platform CLI tool that runs sequences of commands from a single TOML file, making repetitive tasks fast and consistent."
license = "MIT"
repository = "https://github.com/opmr0/xeq"
readme = "README.md"
keywords = ["task-runner", "automation", "cli", "build-tool", "toml"]
categories = ["command-line-utilities", "development-tools", "config"]
exclude = [
    "target/*",
    "examples/*",
    ".github/*",
]


[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
clearscreen = "4.0.6"
colored = "3.1.1"
confy = "0.6.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
dunce = "1.0.5"
num_cpus = "1.17.0"
open = "5.3.3"
serde = { version = "1.0.228", features = ["derive"] }
threadpool = "1.8.1"
toml = "1.1.0"
uuid = { version = "1.23.0", features = ["v4"] }
which = "8.0.2"

[dev-dependencies]
tempfile = "3"
