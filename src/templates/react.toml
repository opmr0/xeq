[create]
description = "Scaffold a new project - xeq run create --args my-app react-ts"
run = [
    "npm create vite@latest {{1}} -- --template {{2}}",
    "cd {{1}}",
    "npm install",
]

[dev]
description = "Start Vite dev server"
run = ["npm run dev"]

[build]
description = "Production build"
run = ["npm run build"]

[preview]
description = "Preview production build locally"
run = [
    "xeq:build",
    "npm run preview",
]

[test]
description = "Run tests with Vitest"
run = ["npm run test"]

[check]
description = "Lint and build in parallel"
parallel_threads = 2
run = [
    "npm run lint",
    "npm run build",
]
