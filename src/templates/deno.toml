[dev]
description = "Run with watch mode"
run = ["deno run --watch --allow-all main.ts"]

[start]
description = "Run the project"
run = ["deno run --allow-all main.ts"]

[test]
description = "Run test suite"
run = ["deno test --allow-all"]

[check]
description = "Lint, format check and test in parallel"
parallel_threads = 3
run = [
    "deno lint",
    "deno fmt --check",
    "deno test --allow-all",
]

[format]
description = "Format all files"
run = ["deno fmt"]

[compile]
description = "Compile to a self-contained binary — xeq run compile --args my-app"
run = ["deno compile --allow-all --output {{1}} main.ts"]

[cache]
description = "Cache all dependencies"
run = ["deno cache main.ts"]

[upgrade]
description = "Upgrade Deno to latest"
run = ["deno upgrade"]
