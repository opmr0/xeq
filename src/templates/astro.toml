[vars]
pkg_manager = "npm"

[install]
description = "Install dependencies"
run = ["{{@pkg_manager}} install"]

[dev]
description = "Start Astro dev server"
run = [
    "xeq://install",
    "{{@pkg_manager}} run dev",
]

[build]
description = "Production build"
run = [
    "xeq://install",
    "{{@pkg_manager}} run build",
]

[preview]
description = "Preview production build locally"
run = [
    "xeq://build",
    "{{@pkg_manager}} run preview",
]

[check]
description = "Type-check Astro files"
run = ["{{@pkg_manager}} run astro check"]

[add]
description = "Add an Astro integration — xeq run add --args tailwind"
run = ["{{@pkg_manager}} run astro add {{1}}"]

[sync]
description = "Sync content collections"
run = ["{{@pkg_manager}} run astro sync"]

[clean]
description = "Remove dist and cache"
run = [
    "rm -rf dist",
    "rm -rf .astro",
    "rm -rf node_modules",
]
